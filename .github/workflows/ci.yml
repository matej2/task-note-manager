name: Run tests when PR is created

on:
  issue_comment:
    types: [created]

jobs:
  run-tests:
    name: Run tests on PR when new comment is added
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Checkout branch
        run: |
          gh pr checkout ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.4'

      - name: Install dependencies with apt get
        run: |
          sudo apt-get install -y libdbus-1-dev libdbus-glib-1-dev

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies with Pipenv
        run: |
          pipenv install --dev --deploy

      - name: Run tests with coverage and upload resulting html file
        run: |
          pipenv run coverage run -m unittest discover -s test && pipenv run coverage xml -o coverage.xml

      - name: Run tests with coverage
        run: |
          pipenv run coverage run -m unittest discover -s test && pipenv run coverage xml -o coverage.xml

      - name: Post coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const total = execSync('pipenv run coverage report --format=total', { cwd: process.env.GITHUB_WORKSPACE }).toString().trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `## Coverage Report\nTotal coverage: **${total}%**`
            });