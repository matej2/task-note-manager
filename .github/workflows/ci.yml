name: Run tests when PR is created

on:
  pull_request:
    types: [opened, reopened]

permissions:
    contents: read
    pull-requests: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: linux

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.4'

      # Step 3: Install Pipenv
      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      # Step 4: Install dependencies using Pipenv
      - name: Install dependencies with Pipenv
        run: |
          pipenv install --dev

      - name: Run tests with coverage and upload resulting html file
        run: |
          coverage run -m unittest discover && coverage xml coverage.xml

      - name: Get Cover
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}