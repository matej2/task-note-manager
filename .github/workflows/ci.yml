name: Run tests when PR is created

on:
  issue_comment:
    types: [created]

jobs:
  run-tests:
    name: Run tests on PR when new comment is added
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        run: |
          gh pr checkout ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.4'

      - name: Install dependencies with apt get
        run: |
          sudo apt-get install -y libdbus-1-dev libdbus-glib-1-dev

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies with Pipenv
        run: |
          pipenv install --dev

      - name: Run tests with coverage and upload resulting html file
        run: |
          pipenv run coverage run -m unittest discover && coverage xml -o coverage.xml

      - name: Get Cover
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}